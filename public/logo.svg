<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B6FF5C" />
      <stop offset="100%" stop-color="#50E3C2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Geometric hexagonal flowing loop path -->
  <rect width="40" height="40" rx="10" fill="#0D151B" stroke="#1B2B30" stroke-width="1.5"/>
  <path d="M12 28 C 12 18, 20 18, 20 12 C 20 18, 28 18, 28 28" stroke="url(#mintGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  <circle cx="20" cy="12" r="2.5" fill="#B6FF5C" />
  <circle cx="12" cy="28" r="2" fill="#50E3C2" />
  <circle cx="28" cy="28" r="2" fill="#D8FFE8" />
  <path d="M16 24 L24 24" stroke="#B6FF5C" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
